<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lecture-aligned visualizations for learning algorithm analysis.">
  <meta name="theme-color" content="#263d72">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <title>Analysis of Algorithms</title>
  <link rel="stylesheet" href="./assets/vendor/katex/katex.min.css?v=0.18.7">
  <link rel="stylesheet" href="./assets/styles/tokens.css?v=20260916-1">
  <link rel="stylesheet" href="./assets/styles/base.css?v=20260916-1">
  <link rel="stylesheet" href="./assets/styles/layout.css?v=20260916-1">
  <link rel="stylesheet" href="./assets/styles/components.css?v=20260916-5">
  <link rel="stylesheet" href="./assets/styles/visualizations.css?v=20260916-2">
  <link rel="stylesheet" href="./src/lectures/03-analysis/styles.css?v=20260916-2">
  <link rel="stylesheet" href="./src/lectures/04-brute-force/styles.css?v=20260916-6">
  <link rel="stylesheet" href="./src/lectures/05-exhaustive-search/styles.css?v=20260916-2">
</head>
<body>
  <a class="skip-link" href="#lessonMain">Skip to the lecture</a>

  <header class="topbar">
    <button id="navToggle" class="nav-button" type="button" aria-label="Open lecture navigation" aria-controls="courseNav" aria-expanded="false">
      <span class="nav-menu-icon" aria-hidden="true"></span>
      <span>Lectures</span>
    </button>

    <div class="route-summary" aria-live="polite">
      <div class="route-context">
        <span id="topLectureLabel">Lecture 03</span>
        <span class="route-context-separator" aria-hidden="true">·</span>
        <span id="topModuleLabel">Analysis of Algorithms</span>
      </div>
      <h1 id="lessonTitle">Number of Binary Digits — Iterative</h1>
    </div>

    <nav class="header-pager" aria-label="Previous and next visualization">
      <button id="previousModuleButton" class="top-pager-button" type="button"></button>
      <button id="nextModuleButton" class="top-pager-button" type="button"></button>
    </nav>
  </header>

  <button id="navBackdrop" class="nav-backdrop" type="button" aria-label="Close lecture navigation" tabindex="-1"></button>
  <aside id="courseNav" class="course-nav" aria-label="Lecture navigation" aria-hidden="true" inert>
    <div class="course-nav-heading">
      <div>
        <p class="eyebrow">Course</p>
        <h2>Lectures</h2>
      </div>
      <button id="navClose" class="icon-button" type="button" aria-label="Close lecture navigation">×</button>
    </div>
    <nav id="lectureNavigation"></nav>
  </aside>

  <main id="lessonMain" class="lesson-main" tabindex="-1">
    <section class="lab-shell" aria-label="Interactive lecture visualization">
      <div class="lab-toolbar">
        <form id="inputForm" class="input-form" novalidate>
          <div class="field-heading">
            <label id="inputLabel" for="algorithmInput">Input</label>
            <span id="inputHint" class="field-hint"></span>
          </div>
          <div class="input-cluster">
            <input id="algorithmInput" name="algorithmInput" type="text" autocomplete="off" spellcheck="false" aria-describedby="inputHint inputError">
            <button class="button button-primary" type="submit">Apply</button>
          </div>
          <p id="inputError" class="field-error" role="alert" hidden></p>
        </form>

        <div class="scenario-block">
          <label class="field-label" for="scenarioSelect">Example</label>
          <select id="scenarioSelect" class="scenario-select"></select>
        </div>

        <div id="modeBlock" class="mode-block" hidden>
          <span class="field-label">Mode</span>
          <div id="modeButtons" class="segmented-control" role="group" aria-label="Activity mode"></div>
        </div>
      </div>

      <div class="stage-grid">
        <article class="stage-panel visualization-panel" aria-labelledby="visualizationTitle">
          <header class="panel-heading">
            <h2 id="visualizationTitle">Visualization</h2>
            <span id="stepCounter" class="step-counter">Step 0 / 0</span>
          </header>
          <div id="visualization" class="visualization"></div>
        </article>

        <article class="stage-panel code-panel" aria-labelledby="pseudocodeTitle">
          <header class="panel-heading">
            <h2 id="pseudocodeTitle">Pseudocode</h2>
            <span id="activeLineBadge" class="line-badge">Ready</span>
          </header>
          <ol id="pseudocode" class="pseudocode" aria-label="Pseudocode"></ol>
        </article>
      </div>

      <div id="traceControls" class="transport-bar" aria-label="Trace controls">
        <button id="previousButton" class="icon-button" type="button" aria-label="Previous step">←</button>
        <button id="playButton" class="button button-primary play-button" type="button" aria-label="Play trace">
          <span id="playIcon" aria-hidden="true">▶</span>
          <span id="playLabel">Play</span>
        </button>
        <button id="nextButton" class="icon-button" type="button" aria-label="Next step">→</button>
        <label class="timeline-control" for="stepRange">
          <span class="sr-only">Trace position</span>
          <input id="stepRange" type="range" min="0" max="0" value="0" step="1">
        </label>
        <button id="resetButton" class="button button-quiet" type="button">Restart</button>
      </div>

      <div id="activityControls" class="transport-bar" hidden></div>

      <section class="trace-summary" aria-label="Trace and count">
        <article class="trace-summary-item action-panel">
          <p class="section-label">Trace</p>
          <p id="stepMessage" class="signal-copy"></p>
        </article>
        <article class="trace-summary-item count-panel">
          <p class="section-label">Count</p>
          <dl id="metrics" class="metrics"></dl>
        </article>
      </section>
    </section>

    <section class="generalize-panel" aria-labelledby="generalizeTitle">
      <header class="generalize-heading">
        <p class="section-label">Generalize</p>
        <h2 id="generalizeTitle">Mathematical model</h2>
      </header>
      <div id="formulaPanel" class="formula-panel"></div>
      <details class="analysis-details">
        <summary>
          <span>Lecture analysis</span>
          <small>Input size, basic operation, cases, and conclusion</small>
        </summary>
        <dl id="analysisChecklist" class="analysis-checklist"></dl>
      </details>
    </section>

  </main>

  <p id="liveStatus" class="sr-only" aria-live="polite"></p>
  <noscript><div class="noscript-message">This site requires JavaScript.</div></noscript>

  <script src="./assets/vendor/katex/katex.min.js?v=0.18.7"></script>
  <script type="module" src="./src/main.js?v=20260916-7"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algorithm Lab Embed Example</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      color: #14242d;
      background: #f5f8f9;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 1200px; margin: 0 auto; }
    iframe {
      display: block;
      width: 100%;
      height: 860px;
      border: 0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 34px rgba(27, 56, 68, 0.1);
    }
  </style>
</head>
<body>
  <main>
    <h1>Tower of Hanoi lesson</h1>
    <p>This page demonstrates how one module can be embedded in another website.</p>
    <iframe
      src="./?embed=1&module=hanoi"
      title="Tower of Hanoi interactive visualization"
      loading="lazy">
    </iframe>
  </main>
</body>
</html>
